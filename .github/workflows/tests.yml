name: Tests & Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    name: Tests & Code Quality
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: inventario_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, mysql, pdo_mysql
          coverage: xdebug

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "::set-output name=dir::$(composer config cache-files-dir)"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: Inventario/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Composer dependencies
        working-directory: Inventario
        run: composer install --prefer-dist --no-progress

      - name: Install Node dependencies
        working-directory: Inventario
        run: npm ci

      - name: Copy environment file
        working-directory: Inventario
        run: cp .env.example .env

      - name: Generate application key
        working-directory: Inventario
        run: php artisan key:generate

      - name: Configure database
        working-directory: Inventario
        run: |
          sed -i 's/DB_CONNECTION=mariadb/DB_CONNECTION=mariadb/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=3306/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=laravel/DB_DATABASE=inventario_test/' .env
          sed -i 's/DB_USERNAME=root/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=password/' .env

      - name: Run migrations
        working-directory: Inventario
        run: php artisan migrate --force

      - name: Run tests with coverage
        working-directory: Inventario
        run: composer run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: Inventario/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Run PHPStan analysis
        working-directory: Inventario
        run: composer run analyse -- --error-format=github

      - name: Run Laravel Pint (code style)
        working-directory: Inventario
        run: composer run format -- --test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            Inventario/coverage-report/
            Inventario/coverage.xml

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security scan
        uses: symfonycorp/security-checker-action@v5
        with:
          path: Inventario/composer.lock

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Generate test summary
        run: |
          echo "✅ Tests & Quality checks completed successfully!"
          echo ""
          echo "📊 Test Coverage Report: See artifacts"
          echo "🔒 Security Scan: Passed"
          echo "📝 Code Style: Passed"
          echo "🔍 Static Analysis: Passed"
